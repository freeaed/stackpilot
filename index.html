<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackPilot</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
    background: #0f1115;
    color: #e6e8ee;
  }
  main { max-width: 34rem; padding: 2.5rem; }
  h1 { margin: 0 0 .25rem; font-size: 2rem; letter-spacing: -.02em; }
  p { margin: 0 0 1rem; color: #a8b0c0; }
  a { color: #6ea8fe; text-decoration: none; }
  a:hover { text-decoration: underline; }
  nav { display: flex; gap: 1.25rem; margin-top: 1.5rem; }
  .note { margin-top: 2rem; font-size: .875rem; color: #6f7787; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>StackPilot</h1>
  <p>Local PHP, Apache, and MySQL stacks for Windows.</p>
  <nav>
    <a href="https://github.com/freeaed/stackpilot/releases">Downloads</a>
    <a href="https://github.com/freeaed/stackpilot">Source</a>
    <a href="https://github.com/freeaed/stackpilot/issues">Issues</a>
  </nav>
  <p class="note">
    This site also serves the signed update manifest at
    <code>/updates/manifest.json</code>.
  </p>
</main>
</body>
</html>
